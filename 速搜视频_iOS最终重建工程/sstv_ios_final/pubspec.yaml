name: sstv_ios_rebuild
description: 速搜视频 iOS 重建工程（基于已提供 APK 的可迁移功能重建）
publish_to: 'none'
version: 1.4.1+141

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  flutter_inappwebview: ^6.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/img/ic_launcher_foreground.webp
